name: dategpt-tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Run backend unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Compile desktop frontend
        working-directory: .
        run: python -m py_compile desktop/*.py
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Smoke test PySide frontend
        working-directory: .
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/smoke_test.py

  macos-desktop-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke test PySide frontend on macOS
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/smoke_test.py

