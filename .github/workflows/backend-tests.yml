name: backend-tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Compile desktop frontend
        working-directory: .
        run: python -m py_compile desktop/*.py
      - name: Install desktop dependency
        working-directory: .
        run: python -m pip install -r desktop/requirements.txt
      - name: Smoke test PySide frontend
        working-directory: .
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/smoke_test.py
